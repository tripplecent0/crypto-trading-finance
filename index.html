<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Global Assets | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <nav class="border-b border-slate-900 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="h-8 w-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-slate-950">A</div>
            <span class="text-lg font-bold tracking-wider uppercase text-emerald-400">ApexGlobal</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full font-medium border border-emerald-500/20">● Account Verified</span>
            <div class="h-9 w-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300">U</div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        
        <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row md:justify-between md:items-center gap-6">
            <div>
                <p class="text-xs font-medium text-slate-400 tracking-wider uppercase mb-1">Total Account Balance (USDT)</p>
                <h1 id="balance-display" class="text-4xl font-extrabold tracking-tight text-white transition-all duration-300">$20.00</h1>
                <p class="text-xs text-emerald-400 mt-1 font-medium flex items-center gap-1">
                    <span>↑ +<span id="profit-percent">0.00</span>% Today</span>
                </p>
            </div>
            <div class="flex gap-3">
                <button onclick="triggerDepositModal()" class="flex-1 md:flex-initial px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition cursor-pointer">Quick Deposit</button>
                <button onclick="triggerWithdrawalModal()" class="flex-1 md:flex-initial px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition cursor-pointer">Withdraw Funds</button>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Live Return Performance (24h)</h3>
                <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-md border border-slate-700">Real-Time Data Feed</span>
            </div>
            <div class="w-full h-64 md:h-80">
                <canvas id="livePerformanceChart"></canvas>
            </div>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
