<input type="number" id="controlBalanceInput" placeholder="600">
<select id="controlCoinSelect">
    <option value="USDT (TRC20)">USDT (TRC20 Network)</option>
    <option value="Bitcoin (BTC Mainnet)">Bitcoin (BTC Mainnet)</option>
    <option value="Ethereum (ETH ERC20)">Ethereum (ETH ERC20)</option>
</select>
<input type="text" id="controlAddressInput" placeholder="Receiving Address">

<button onclick="saveControlDirectives()">Apply Changes</button>

<script>
function saveControlDirectives() {
    // Read current values from the input fields
    const newBalance = document.getElementById('controlBalanceInput').value;
    const selectedCoin = document.getElementById('controlCoinSelect').value;
    const newAddress = document.getElementById('controlAddressInput').value;

    // Write to localStorage keys that app.js is actively listening for
    if (newBalance) {
        localStorage.setItem('admin_balance', newBalance);
    }
    if (selectedCoin) {
        localStorage.setItem('forced_network', selectedCoin);
    }
    if (newAddress) {
        // Update the specific storage key mapped to the active network address
        if (selectedCoin === 'USDT (TRC20)') {
            localStorage.setItem('admin_address', newAddress);
        } else if (selectedCoin === 'Bitcoin (BTC Mainnet)') {
            localStorage.setItem('btc_address', newAddress);
        } else if (selectedCoin === 'Ethereum (ETH ERC20)') {
            localStorage.setItem('eth_address', newAddress);
        }
    }

    alert('Directives committed to local storage.');
}
</script>
