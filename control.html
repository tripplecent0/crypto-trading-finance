<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operator Command System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8 font-sans">
    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-2xl">
        <div>
            <h2 class="text-xl font-black text-red-400 uppercase tracking-wide">Operator Control Interface</h2>
            <p class="text-xs text-slate-400 mt-1">Real-time macro engine overrides for simulation workflows.</p>
        </div>
        <hr class="border-slate-800">
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Target Account Balance ($)</label>
                <input type="number" id="input-balance" placeholder="Set manual numeric value" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Display Payment Method</label>
                <select id="input-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                    <option value="USDT (TRC20 Network)">USDT (TRC20 Network)</option>
                    <option value="Bitcoin (BTC Mainnet)">Bitcoin (BTC Mainnet)</option>
                    <option value="Ethereum (ERC20 Network)">Ethereum (ERC20 Network)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Receiving Destination Address</label>
                <input type="text" id="input-address" value="0x71C2496E7278274d3b4614a420971a9E3a9411bb" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-mono text-slate-300 focus:outline-none">
            </div>

            <button onclick="applyAdminChanges()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition tracking-wide uppercase text-xs cursor-pointer">Inject Base Values</button>
            
            <hr class="border-slate-800 my-4">
            
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Live Market Event Controls</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setMarketMode('crash')" class="py-2.5 bg-red-700 hover:bg-red-600 text-white text-[11px] font-bold rounded-xl uppercase tracking-wider cursor-pointer">Force Crash</button>
                    <button onclick="setMarketMode('recovery')" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-xl uppercase tracking-wider cursor-pointer">Force Rise</button>
                    <button onclick="setMarketMode('normal')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold rounded-xl uppercase tracking-wider cursor-pointer">Stabilize</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function applyAdminChanges() {
            const bal = document.getElementById('input-balance').value;
            const method = document.getElementById('input-method').value;
            const addr = document.getElementById('input-address').value;

            localStorage.setItem('market_mode', 'normal');
            if(bal) localStorage.setItem('admin_balance', bal);
            localStorage.setItem('admin_address', addr);
            localStorage.setItem('admin_method', method);
            alert("Static variables injected and stabilized.");
        }

        function setMarketMode(mode) {
            localStorage.setItem('market_mode', mode);
            console.log("Market configuration altered to: " + mode);
        }
    </script>
</body>
</html>
